# Railway service for apps/api — Nixpacks (Node/pnpm), no containers in-repo.
# See nixpacks.toml: Node 22 + pnpm 10 (Corepack/pnpm 11 is broken on Railway).
[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"
buildCommand = "pnpm turbo run build --filter=@ruma/api..."

[deploy]
startCommand = "pnpm --filter @ruma/api start:prod"
healthcheckPath = "/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
