# Railway service for apps/api — Nixpacks (no Docker in-repo).
# pnpm is invoked via npx so Corepack shims are never required.
[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.toml"
buildCommand = "npx --yes pnpm@10.33.4 turbo run build --filter=@ruma/api..."

[deploy]
preDeployCommand = "npx --yes pnpm@10.33.4 --filter @ruma/api exec prisma migrate deploy"
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
