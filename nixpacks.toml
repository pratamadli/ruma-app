# Corepack + pnpm 11 crashes on Railway. Use npx to pin pnpm 10 without
# relying on global PATH across image layers. Install with --prod=false so
# Nest/Prisma build tools remain available even when NODE_ENV=production.
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]
aptPkgs = ["build-essential", "python3"]

[phases.install]
cmds = ["npx --yes pnpm@10.33.4 install --frozen-lockfile --prod=false"]
